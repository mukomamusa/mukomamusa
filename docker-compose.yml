version: '3.8'

services:
  # Vayazed Application
  vayazed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vayazed-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://vayazed:password@postgres:5432/vayazed
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXT_PUBLIC_BASE_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - vayazed-network
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vayazed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vayazed
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vayazed
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vayazed-network

  # Redis for caching and sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: vayazed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vayazed-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: vayazed-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - vayazed
    networks:
      - vayazed-network

networks:
  vayazed-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: